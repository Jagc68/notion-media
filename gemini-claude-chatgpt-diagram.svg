<svg viewBox="0 0 780 580" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
  <rect width="780" height="580" fill="#ffffff" rx="14"/>
  <text x="390" y="42" text-anchor="middle" font-size="18" font-weight="700" fill="#111">Gemini · Claude · ChatGPT</text>

  <!-- Header -->
  <rect x="210" y="58" width="170" height="52" rx="10" fill="#4285F4"/>
  <text x="295" y="80" text-anchor="middle" font-size="15" font-weight="700" fill="#fff">Gemini</text>
  <text x="295" y="98" text-anchor="middle" font-size="11" fill="#cce0ff">Google</text>
  <rect x="400" y="58" width="170" height="52" rx="10" fill="#c06a44"/>
  <text x="485" y="80" text-anchor="middle" font-size="15" font-weight="700" fill="#fff">Claude</text>
  <text x="485" y="98" text-anchor="middle" font-size="11" fill="#fde8df">Anthropic</text>
  <rect x="590" y="58" width="170" height="52" rx="10" fill="#0f9d72"/>
  <text x="675" y="80" text-anchor="middle" font-size="15" font-weight="700" fill="#fff">ChatGPT</text>
  <text x="675" y="98" text-anchor="middle" font-size="11" fill="#c5f0e4">OpenAI</text>

  <!-- Rij 1: Sterkste kant -->
  <rect x="0" y="124" width="780" height="70" fill="#f7f8fa"/>
  <text x="16" y="146" font-size="10" font-weight="700" fill="#999" letter-spacing="0.5">STERKSTE KANT</text>
  <text x="295" y="152" text-anchor="middle" font-size="12" font-weight="600" fill="#4285F4">Google integratie</text>
  <text x="295" y="170" text-anchor="middle" font-size="12" fill="#4285F4">+ lange context</text>
  <text x="485" y="152" text-anchor="middle" font-size="12" font-weight="600" fill="#c06a44">Instructies volgen</text>
  <text x="485" y="170" text-anchor="middle" font-size="12" fill="#c06a44">+ redeneren</text>
  <text x="675" y="152" text-anchor="middle" font-size="12" font-weight="600" fill="#0f9d72">Breedte</text>
  <text x="675" y="170" text-anchor="middle" font-size="12" fill="#0f9d72">+ ecosysteem</text>

  <!-- Rij 2: Context window -->
  <rect x="0" y="194" width="780" height="72" fill="#ffffff"/>
  <text x="16" y="216" font-size="10" font-weight="700" fill="#999" letter-spacing="0.5">CONTEXT WINDOW</text>
  <rect x="220" y="222" width="150" height="22" rx="11" fill="#4285F4"/>
  <text x="295" y="237" text-anchor="middle" font-size="11" font-weight="700" fill="#fff">~1M tokens</text>
  <rect x="435" y="222" width="100" height="22" rx="11" fill="#c06a44"/>
  <text x="485" y="237" text-anchor="middle" font-size="11" font-weight="700" fill="#fff">~200K tokens</text>
  <rect x="637" y="222" width="76" height="22" rx="11" fill="#0f9d72"/>
  <text x="675" y="237" text-anchor="middle" font-size="11" font-weight="700" fill="#fff">~128K</text>

  <!-- Rij 3: Multimodaal -->
  <rect x="0" y="266" width="780" height="68" fill="#f7f8fa"/>
  <text x="16" y="288" font-size="10" font-weight="700" fill="#999" letter-spacing="0.5">MULTIMODAAL</text>
  <text x="295" y="295" text-anchor="middle" font-size="12" fill="#4285F4">Tekst, beeld,</text>
  <text x="295" y="312" text-anchor="middle" font-size="12" fill="#4285F4">audio + video</text>
  <text x="485" y="303" text-anchor="middle" font-size="12" fill="#c06a44">Tekst + beeld</text>
  <text x="675" y="295" text-anchor="middle" font-size="12" fill="#0f9d72">Tekst, beeld</text>
  <text x="675" y="312" text-anchor="middle" font-size="12" fill="#0f9d72">+ audio</text>

  <!-- Rij 4: Agent platform — fix: lichte achtergrond via fill-opacity, tekst in wit -->
  <rect x="0" y="334" width="780" height="68" fill="#ffffff"/>
  <text x="16" y="356" font-size="10" font-weight="700" fill="#999" letter-spacing="0.5">AGENT PLATFORM</text>
  <rect x="220" y="360" width="150" height="26" rx="6" fill="#4285F4" fill-opacity="0.15"/>
  <text x="295" y="377" text-anchor="middle" font-size="12" font-weight="600" fill="#2a6fd4">Antigravity 2.0</text>
  <rect x="410" y="360" width="150" height="26" rx="6" fill="#c06a44" fill-opacity="0.15"/>
  <text x="485" y="377" text-anchor="middle" font-size="12" font-weight="600" fill="#a0522d">Claude Code / Cowork</text>
  <rect x="600" y="360" width="150" height="26" rx="6" fill="#0f9d72" fill-opacity="0.15"/>
  <text x="675" y="377" text-anchor="middle" font-size="12" font-weight="600" fill="#0a7a58">GPTs / Assistants</text>

  <!-- Rij 5: Internettoegang — geen emoji, gewone tekst -->
  <rect x="0" y="402" width="780" height="64" fill="#f7f8fa"/>
  <text x="16" y="424" font-size="10" font-weight="700" fill="#999" letter-spacing="0.5">INTERNETTOEGANG</text>
  <text x="295" y="440" text-anchor="middle" font-size="12" fill="#4285F4">Google Search</text>
  <text x="485" y="440" text-anchor="middle" font-size="12" fill="#c06a44">Via tools</text>
  <text x="675" y="440" text-anchor="middle" font-size="12" fill="#0f9d72">Bing / web</text>

  <!-- Rij 6: Prijs -->
  <rect x="0" y="466" width="780" height="68" fill="#ffffff"/>
  <text x="16" y="488" font-size="10" font-weight="700" fill="#999" letter-spacing="0.5">BETAALD</text>
  <text x="295" y="500" text-anchor="middle" font-size="13" font-weight="700" fill="#4285F4">AI Pro</text>
  <text x="295" y="518" text-anchor="middle" font-size="11" fill="#777">$19.99 / maand</text>
  <text x="485" y="500" text-anchor="middle" font-size="13" font-weight="700" fill="#c06a44">Claude Pro</text>
  <text x="485" y="518" text-anchor="middle" font-size="11" fill="#777">$20 / maand</text>
  <text x="675" y="500" text-anchor="middle" font-size="13" font-weight="700" fill="#0f9d72">ChatGPT Plus</text>
  <text x="675" y="518" text-anchor="middle" font-size="11" fill="#777">$20 / maand</text>

  <!-- Footer -->
  <rect x="0" y="534" width="780" height="46" fill="#f0f2f5"/>
  <text x="390" y="562" text-anchor="middle" font-size="11" fill="#999">Kies op basis van je taak — power users wisselen bewust tussen de drie</text>

  <!-- Scheidingslijnen -->
  <line x1="200" y1="124" x2="200" y2="534" stroke="#e8e8e8" stroke-width="1.5"/>
  <line x1="390" y1="124" x2="390" y2="534" stroke="#e8e8e8" stroke-width="1.5"/>
  <line x1="580" y1="124" x2="580" y2="534" stroke="#e8e8e8" stroke-width="1.5"/>
</svg>
