<svg viewBox="0 0 700 520" xmlns="http://www.w3.org/2000/svg" font-family="'SF Mono', 'Fira Code', monospace" style="background:#fff">
  <title>CLI &amp; Shell Foundations — Architectuurdiagram</title>
  <desc>Diagram dat de architectuurlagen van CLI toont: developer naar Terminal naar Shell naar OS naar commando-categorieën</desc>

  <rect width="700" height="520" fill="#ffffff" rx="12"/>
  <text x="350" y="36" text-anchor="middle" font-size="15" font-weight="700" fill="#1a1a1a">CLI &amp; Shell — Architectuur</text>

  <!-- Laag 1: Developer -->
  <rect x="240" y="56" width="220" height="52" rx="8" fill="#e8f5e9" stroke="#a5d6a7" stroke-width="1.5"/>
  <text x="350" y="77" text-anchor="middle" font-size="13" font-weight="700" fill="#2e7d32">Developer</text>
  <text x="350" y="96" text-anchor="middle" font-size="11" fill="#2e7d32">Typt commando's</text>

  <!-- Pijl -->
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#aaa"/>
    </marker>
  </defs>
  <line x1="350" y1="108" x2="350" y2="126" stroke="#aaa" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Laag 2: Terminal -->
  <rect x="120" y="130" width="200" height="52" rx="8" fill="#e3f2fd" stroke="#90caf9" stroke-width="1.5"/>
  <text x="220" y="151" text-anchor="middle" font-size="13" font-weight="700" fill="#1565c0">Terminal.app</text>
  <text x="220" y="170" text-anchor="middle" font-size="11" fill="#1565c0">Venster — toont tekst</text>

  <rect x="380" y="130" width="200" height="52" rx="8" fill="#e3f2fd" stroke="#90caf9" stroke-width="1.5"/>
  <text x="480" y="151" text-anchor="middle" font-size="13" font-weight="700" fill="#1565c0">iTerm2 / Warp</text>
  <text x="480" y="170" text-anchor="middle" font-size="11" fill="#1565c0">Alternatieve terminals</text>

  <line x1="350" y1="182" x2="350" y2="200" stroke="#aaa" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Laag 3: Shell -->
  <rect x="120" y="204" width="200" height="52" rx="8" fill="#f3e5f5" stroke="#ce93d8" stroke-width="1.5"/>
  <text x="220" y="225" text-anchor="middle" font-size="13" font-weight="700" fill="#6a1b9a">Zsh</text>
  <text x="220" y="244" text-anchor="middle" font-size="11" fill="#6a1b9a">Standaard macOS (2019+)</text>

  <rect x="380" y="204" width="200" height="52" rx="8" fill="#f3e5f5" stroke="#ce93d8" stroke-width="1.5"/>
  <text x="480" y="225" text-anchor="middle" font-size="13" font-weight="700" fill="#6a1b9a">Bash</text>
  <text x="480" y="244" text-anchor="middle" font-size="11" fill="#6a1b9a">Standaard Linux servers</text>

  <line x1="350" y1="256" x2="350" y2="274" stroke="#aaa" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Laag 4: OS -->
  <rect x="180" y="278" width="340" height="52" rx="8" fill="#fff3e0" stroke="#ffcc80" stroke-width="1.5"/>
  <text x="350" y="299" text-anchor="middle" font-size="13" font-weight="700" fill="#e65100">macOS / Unix Kernel</text>
  <text x="350" y="318" text-anchor="middle" font-size="11" fill="#e65100">Voert commando's echt uit</text>

  <line x1="350" y1="330" x2="350" y2="348" stroke="#aaa" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Laag 5: Categorieen -->
  <text x="350" y="365" text-anchor="middle" font-size="10" fill="#888" letter-spacing="1">COMMANDO-CATEGORIEEN</text>

  <rect x="40"  y="374" width="140" height="52" rx="8" fill="#f5f5f5" stroke="#e0e0e0" stroke-width="1.5"/>
  <text x="110" y="395" text-anchor="middle" font-size="12" font-weight="700" fill="#424242">Navigeren</text>
  <text x="110" y="413" text-anchor="middle" font-size="10" fill="#424242">pwd · ls · cd</text>

  <rect x="195" y="374" width="140" height="52" rx="8" fill="#f5f5f5" stroke="#e0e0e0" stroke-width="1.5"/>
  <text x="265" y="395" text-anchor="middle" font-size="12" font-weight="700" fill="#424242">Bestanden</text>
  <text x="265" y="413" text-anchor="middle" font-size="10" fill="#424242">cp · mv · rm · mkdir</text>

  <rect x="350" y="374" width="140" height="52" rx="8" fill="#f5f5f5" stroke="#e0e0e0" stroke-width="1.5"/>
  <text x="420" y="395" text-anchor="middle" font-size="12" font-weight="700" fill="#424242">Bekijken</text>
  <text x="420" y="413" text-anchor="middle" font-size="10" fill="#424242">cat · less · head · tail</text>

  <rect x="505" y="374" width="155" height="52" rx="8" fill="#fce4ec" stroke="#f48fb1" stroke-width="1.5"/>
  <text x="583" y="395" text-anchor="middle" font-size="12" font-weight="700" fill="#b71c1c">Gevaarlijk</text>
  <text x="583" y="413" text-anchor="middle" font-size="10" fill="#b71c1c">rm -rf (permanent!)</text>

  <!-- Terminal prompt -->
  <rect x="40" y="444" width="620" height="60" rx="8" fill="#1a1a1a"/>
  <text x="60" y="466" font-size="11" fill="#c3e88d">greg@macbook ~ %</text>
  <text x="60" y="484" font-size="11" fill="#82aaff">pwd</text>
  <text x="130" y="484" font-size="11" fill="#676e95">  # /Users/greg/Documents</text>
  <text x="60" y="498" font-size="11" fill="#82aaff">ls -la</text>
  <text x="130" y="498" font-size="11" fill="#676e95">  # toon alle bestanden incl. verborgen</text>
</svg>
