<svg viewBox="0 0 720 420" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif">
  <rect width="720" height="420" fill="#f8fafc" rx="12"/>
  <text x="360" y="30" text-anchor="middle" font-size="14" font-weight="700" fill="#1e293b">Java Ecosysteem</text>

  <!-- .java file -->
  <rect x="30" y="60" width="110" height="64" rx="8" fill="#3b82f6" opacity=".15"/>
  <rect x="30" y="60" width="110" height="64" rx="8" fill="none" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="85" y="86" text-anchor="middle" font-size="20">📝</text>
  <text x="85" y="104" text-anchor="middle" font-size="11" font-weight="600" fill="#1e293b">Main.java</text>
  <text x="85" y="118" text-anchor="middle" font-size="9" fill="#64748b">broncode</text>

  <line x1="142" y1="92" x2="188" y2="92" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="165" y="83" text-anchor="middle" font-size="9" fill="#64748b">javac</text>

  <!-- .class file -->
  <rect x="190" y="60" width="110" height="64" rx="8" fill="#8b5cf6" opacity=".12"/>
  <rect x="190" y="60" width="110" height="64" rx="8" fill="none" stroke="#8b5cf6" stroke-width="1.5"/>
  <text x="245" y="86" text-anchor="middle" font-size="20">⚙️</text>
  <text x="245" y="104" text-anchor="middle" font-size="11" font-weight="600" fill="#1e293b">Main.class</text>
  <text x="245" y="118" text-anchor="middle" font-size="9" fill="#64748b">bytecode</text>

  <line x1="302" y1="92" x2="348" y2="92" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="325" y="83" text-anchor="middle" font-size="9" fill="#64748b">java</text>

  <!-- JVM -->
  <rect x="350" y="55" width="130" height="74" rx="8" fill="#22c55e" opacity=".12"/>
  <rect x="350" y="55" width="130" height="74" rx="8" fill="none" stroke="#22c55e" stroke-width="1.5"/>
  <text x="415" y="82" text-anchor="middle" font-size="20">🖥️</text>
  <text x="415" y="100" text-anchor="middle" font-size="11" font-weight="600" fill="#1e293b">JVM</text>
  <text x="415" y="114" text-anchor="middle" font-size="9" fill="#64748b">voert bytecode uit</text>
  <text x="415" y="124" text-anchor="middle" font-size="9" fill="#64748b">Windows · Mac · Linux</text>

  <line x1="482" y1="92" x2="528" y2="92" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- Output -->
  <rect x="530" y="60" width="158" height="64" rx="8" fill="#1e293b" opacity=".06"/>
  <rect x="530" y="60" width="158" height="64" rx="8" fill="none" stroke="#1e293b" stroke-width="1" stroke-dasharray="4 3"/>
  <text x="609" y="85" text-anchor="middle" font-size="11" fill="#64748b">$ java Main</text>
  <text x="609" y="102" text-anchor="middle" font-size="11" font-weight="600" fill="#16a34a">Hallo, Java!</text>
  <text x="609" y="117" text-anchor="middle" font-size="9" fill="#64748b">output</text>

  <!-- JDK/JRE nesting -->
  <text x="30" y="166" font-size="11" font-weight="700" fill="#64748b">Relatie JDK · JRE · JVM</text>

  <rect x="30" y="178" width="380" height="210" rx="10" fill="#3b82f6" opacity=".08"/>
  <rect x="30" y="178" width="380" height="210" rx="10" fill="none" stroke="#3b82f6" stroke-width="2"/>
  <text x="52" y="198" font-size="11" font-weight="700" fill="#2563eb">JDK — Java Development Kit</text>
  <text x="52" y="213" font-size="9" fill="#64748b">Alles wat een developer nodig heeft</text>

  <rect x="44" y="222" width="72" height="40" rx="6" fill="#3b82f6" opacity=".18"/>
  <text x="80" y="238" text-anchor="middle" font-size="10" font-weight="600" fill="#1e293b">javac</text>
  <text x="80" y="252" text-anchor="middle" font-size="8" fill="#64748b">compiler</text>

  <rect x="124" y="222" width="72" height="40" rx="6" fill="#3b82f6" opacity=".18"/>
  <text x="160" y="238" text-anchor="middle" font-size="10" font-weight="600" fill="#1e293b">javadoc</text>
  <text x="160" y="252" text-anchor="middle" font-size="8" fill="#64748b">documentatie</text>

  <rect x="204" y="222" width="72" height="40" rx="6" fill="#3b82f6" opacity=".18"/>
  <text x="240" y="238" text-anchor="middle" font-size="10" font-weight="600" fill="#1e293b">jdb</text>
  <text x="240" y="252" text-anchor="middle" font-size="8" fill="#64748b">debugger</text>

  <!-- JRE -->
  <rect x="44" y="272" width="352" height="104" rx="8" fill="#8b5cf6" opacity=".08"/>
  <rect x="44" y="272" width="352" height="104" rx="8" fill="none" stroke="#8b5cf6" stroke-width="1.5"/>
  <text x="64" y="290" font-size="11" font-weight="700" fill="#7c3aed">JRE — Java Runtime Environment</text>
  <text x="64" y="304" font-size="9" fill="#64748b">Alleen voor uitvoeren (niet schrijven)</text>

  <rect x="60" y="312" width="120" height="52" rx="6" fill="#8b5cf6" opacity=".15"/>
  <text x="120" y="330" text-anchor="middle" font-size="9" font-weight="600" fill="#1e293b">Standaard</text>
  <text x="120" y="343" text-anchor="middle" font-size="9" font-weight="600" fill="#1e293b">Bibliotheken</text>
  <text x="120" y="356" text-anchor="middle" font-size="8" fill="#64748b">java.util, java.io…</text>

  <rect x="196" y="312" width="188" height="52" rx="6" fill="#22c55e" opacity=".15"/>
  <rect x="196" y="312" width="188" height="52" rx="6" fill="none" stroke="#22c55e" stroke-width="1.5"/>
  <text x="290" y="332" text-anchor="middle" font-size="11" font-weight="700" fill="#16a34a">JVM</text>
  <text x="290" y="347" text-anchor="middle" font-size="9" fill="#64748b">Java Virtual Machine</text>
  <text x="290" y="360" text-anchor="middle" font-size="8" fill="#64748b">"Write Once, Run Anywhere"</text>

  <!-- Summary -->
  <rect x="430" y="178" width="262" height="210" rx="10" fill="#1e293b" opacity=".04"/>
  <rect x="430" y="178" width="262" height="210" rx="10" fill="none" stroke="#1e293b" stroke-width="1" stroke-dasharray="4 3"/>
  <text x="450" y="200" font-size="11" font-weight="700" fill="#1e293b">Samenvatting</text>
  <text x="450" y="226" font-size="10" font-weight="600" fill="#2563eb">JDK installeren?</text>
  <text x="450" y="240" font-size="9" fill="#64748b">✓ Ja — om Java te schrijven</text>
  <text x="450" y="264" font-size="10" font-weight="600" fill="#7c3aed">JRE apart installeren?</text>
  <text x="450" y="278" font-size="9" fill="#64748b">✗ Nee — JDK bevat JRE al</text>
  <text x="450" y="302" font-size="10" font-weight="600" fill="#16a34a">JVM per platform?</text>
  <text x="450" y="316" font-size="9" fill="#64748b">✓ Ja — maar jouw code</text>
  <text x="450" y="329" font-size="9" fill="#64748b">    hoeft niet aan te passen</text>
  <text x="450" y="353" font-size="10" font-weight="600" fill="#1e293b">Compilatiestroom:</text>
  <text x="450" y="367" font-size="9" fill="#64748b">.java → javac → .class → JVM</text>
  <text x="450" y="381" font-size="9" fill="#64748b">→ output</text>

  <defs>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#94a3b8"/>
    </marker>
  </defs>
</svg>