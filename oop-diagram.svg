<svg viewBox="0 0 1100 740" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, -apple-system, sans-serif">
  <rect width="1100" height="740" fill="white"/>

  <!-- Connectors -->
  <line x1="550" y1="300" x2="265" y2="225" stroke="#6366f1" stroke-width="2.5" opacity="0.5"/>
  <line x1="550" y1="300" x2="835" y2="225" stroke="#10b981" stroke-width="2.5" opacity="0.5"/>
  <line x1="550" y1="415" x2="265" y2="510" stroke="#f59e0b" stroke-width="2.5" opacity="0.5"/>
  <line x1="550" y1="415" x2="835" y2="510" stroke="#ec4899" stroke-width="2.5" opacity="0.5"/>

  <!-- CENTER: OOP -->
  <rect x="405" y="295" width="290" height="125" rx="20" fill="#1e1b4b"/>
  <text x="550" y="345" text-anchor="middle" font-size="32" font-weight="700" fill="white">OOP</text>
  <text x="550" y="378" text-anchor="middle" font-size="15" fill="#a5b4fc">Object-Georiënteerd</text>
  <text x="550" y="400" text-anchor="middle" font-size="15" fill="#a5b4fc">Programmeren</text>

  <!-- PILLAR 1: Encapsulatie -->
  <rect x="80" y="120" width="370" height="110" rx="16" fill="#6366f1"/>
  <text x="265" y="162" text-anchor="middle" font-size="22" font-weight="700" fill="white">🔒 Encapsulatie</text>
  <text x="265" y="192" text-anchor="middle" font-size="15" fill="#e0e7ff">Data afschermen met private</text>
  <text x="265" y="214" text-anchor="middle" font-size="15" fill="#c7d2fe">Toegang via getters &amp; setters</text>

  <!-- PILLAR 2: Overerving -->
  <rect x="650" y="120" width="370" height="110" rx="16" fill="#10b981"/>
  <text x="835" y="162" text-anchor="middle" font-size="22" font-weight="700" fill="white">🧬 Overerving</text>
  <text x="835" y="192" text-anchor="middle" font-size="15" fill="#d1fae5">Klasse erft van een andere klasse</text>
  <text x="835" y="214" text-anchor="middle" font-size="15" fill="#a7f3d0">Gebruik: extends</text>

  <!-- PILLAR 3: Polymorfisme -->
  <rect x="80" y="455" width="370" height="110" rx="16" fill="#f59e0b"/>
  <text x="265" y="497" text-anchor="middle" font-size="22" font-weight="700" fill="white">🎭 Polymorfisme</text>
  <text x="265" y="527" text-anchor="middle" font-size="15" fill="#fef3c7">Zelfde aanroep, ander gedrag</text>
  <text x="265" y="549" text-anchor="middle" font-size="15" fill="#fde68a">Supertype verwijst naar subtype</text>

  <!-- PILLAR 4: Abstractie -->
  <rect x="650" y="455" width="370" height="110" rx="16" fill="#ec4899"/>
  <text x="835" y="497" text-anchor="middle" font-size="22" font-weight="700" fill="white">🌫️ Abstractie</text>
  <text x="835" y="527" text-anchor="middle" font-size="15" fill="#fce7f3">Verberg complexiteit</text>
  <text x="835" y="549" text-anchor="middle" font-size="15" fill="#fbcfe8">Toon alleen wat nodig is</text>
</svg>
