<svg viewBox="0 0 820 560" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, -apple-system, sans-serif">
  <rect width="820" height="560" fill="white"/>
  <!-- v5 -->

  <!-- Connectors -->
  <line x1="410" y1="230" x2="200" y2="175" stroke="#6366f1" stroke-width="2" opacity="0.5"/>
  <line x1="410" y1="230" x2="620" y2="175" stroke="#10b981" stroke-width="2" opacity="0.5"/>
  <line x1="410" y1="310" x2="200" y2="385" stroke="#f59e0b" stroke-width="2" opacity="0.5"/>
  <line x1="410" y1="310" x2="620" y2="385" stroke="#ec4899" stroke-width="2" opacity="0.5"/>

  <!-- CENTER: OOP -->
  <rect x="310" y="225" width="200" height="95" rx="16" fill="#1e1b4b"/>
  <text x="410" y="262" text-anchor="middle" font-size="22" font-weight="700" fill="white">OOP</text>
  <text x="410" y="286" text-anchor="middle" font-size="11.5" fill="#a5b4fc">Object-Georiënteerd</text>
  <text x="410" y="302" text-anchor="middle" font-size="11.5" fill="#a5b4fc">Programmeren</text>

  <!-- PILLAR 1: Encapsulatie -->
  <rect x="70" y="100" width="260" height="80" rx="12" fill="#6366f1"/>
  <text x="200" y="131" text-anchor="middle" font-size="16" font-weight="700" fill="white">🔒 Encapsulatie</text>
  <text x="200" y="152" text-anchor="middle" font-size="11" fill="#e0e7ff">Data afschermen met private</text>
  <text x="200" y="168" text-anchor="middle" font-size="11" fill="#c7d2fe">Toegang via getters &amp; setters</text>

  <!-- PILLAR 2: Overerving -->
  <rect x="490" y="100" width="260" height="80" rx="12" fill="#10b981"/>
  <text x="620" y="131" text-anchor="middle" font-size="16" font-weight="700" fill="white">🧬 Overerving</text>
  <text x="620" y="152" text-anchor="middle" font-size="11" fill="#d1fae5">Klasse erft van een andere klasse</text>
  <text x="620" y="168" text-anchor="middle" font-size="11" fill="#a7f3d0">Gebruik: extends</text>

  <!-- PILLAR 3: Polymorfisme -->
  <rect x="70" y="340" width="260" height="80" rx="12" fill="#f59e0b"/>
  <text x="200" y="371" text-anchor="middle" font-size="16" font-weight="700" fill="white">🎭 Polymorfisme</text>
  <text x="200" y="392" text-anchor="middle" font-size="11" fill="#fef3c7">Zelfde aanroep, ander gedrag</text>
  <text x="200" y="408" text-anchor="middle" font-size="11" fill="#fde68a">Supertype verwijst naar subtype</text>

  <!-- PILLAR 4: Abstractie -->
  <rect x="490" y="340" width="260" height="80" rx="12" fill="#ec4899"/>
  <text x="620" y="371" text-anchor="middle" font-size="16" font-weight="700" fill="white">🌫️ Abstractie</text>
  <text x="620" y="392" text-anchor="middle" font-size="11" fill="#fce7f3">Verberg complexiteit</text>
  <text x="620" y="408" text-anchor="middle" font-size="11" fill="#fbcfe8">Toon alleen wat nodig is</text>
</svg>